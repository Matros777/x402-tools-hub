# Cloudflare Workers configuration
# x402 Tools Hub — paid tools for AI agents, free tools for humans

name = "x402-tools-hub"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Public configuration (no secrets here!)
X402_NETWORK = "base"
X402_FACILITATOR_URL = "https://facilitator.xpay.sh"
SITE_NAME = "x402 Tools Hub"
# SITE_URL is provided by Cloudflare at deploy time (workers.dev).
# Do NOT hardcode a custom domain here.

# SECRET — must NOT be committed or placed in [vars].
# Local dev:  echo 'X402_PAY_TO="0xYourAddr"' >> .dev.vars
# Production: wrangler secret put X402_PAY_TO

[placement]
mode = "smart"

[assets]
directory = "./public"
binding = "ASSETS"
